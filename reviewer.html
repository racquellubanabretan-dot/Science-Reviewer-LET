        // Runtime variables
        let filteredQuestions = [...questionBank];
        let currentPage = 1;
        const itemsPerPage = 50;
	let totalCorrectAnswers = 0;
	let totalUserAttempts = 0;

        // 2. RENDER ENGINE: Builds HTML dynamically
        function renderQuestions() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = ""; // Clear current view

            // Calculate pagination indices
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageItems = filteredQuestions.slice(startIndex, endIndex);

            if (pageItems.length === 0) {
                container.innerHTML = "<p>No questions found.</p>";
                updatePaginationControls();
                return;
            }

            pageItems.forEach((q) => {
                const qBox = document.createElement('div');
                qBox.className = 'question-box';

                // Build options links list
                let optionsHTML = '';
                qIndex = q.id;
                q.options.forEach(opt => {
                    optionsHTML += `<li><a href="#" onclick="checkAnswer(event, '${opt}', '${q.correctAnswer}', 'rat-${q.id}')">${opt}</a></li>`;
                });

                qBox.innerHTML = `
                    <h3>Q: ${q.question}</h3>
                    <ul class="options">${optionsHTML}</ul>
                    <div id="rat-${q.id}" class="rationale">
                        <strong>Correct!</strong> ${q.rationale}
                    </div>
                `;
                container.appendChild(qBox);
            });

            updatePaginationControls();
        }

        // 3. LOGIC: Handle click answer validation
       // 3. LOGIC: Handle click answer validation
function checkAnswer(event, selected, correct, rationaleId) {
    event.preventDefault();
    const ratBox = document.getElementById(rationaleId);
    
    // Check if this question was already answered to avoid double-scoring the same box
    if (ratBox.style.display === 'block') {
        return; // Stops execution if they click options on an already-resolved question
    }
    
    // Increase total attempts counter every time an unanswered question gets clicked
    totalUserAttempts++;

    if (selected === correct) {
        ratBox.style.display = 'block';
        totalCorrectAnswers++; // Increase correct tally
    } else {
        ratBox.style.display = 'block'; // Shows the rationale block directly even if incorrect
        // Optional custom styling tweak to denote incorrect hits visually:
        ratBox.innerHTML = `<strong style="color:red;">Incorrect!</strong> Your choice "${selected}" is wrong. <br><br>` + ratBox.innerHTML;
    }
    
    // Dynamically update the scoreboard text numbers on your screen instantly
    document.getElementById('scoreCounter').innerText = totalCorrectAnswers;
    document.getElementById('attemptCounter').innerText = totalUserAttempts;
}


        // 4. LOGIC: Live filtering/searching
        function handleSearch() {
            const searchTerm = document.getElementById('searchBar').value.toLowerCase();
            filteredQuestions = questionBank.filter(q => 
                q.question.toLowerCase().includes(searchTerm) || 
                q.rationale.toLowerCase().includes(searchTerm)
            );
            currentPage = 1; // Reset to page 1 on search
            renderQuestions();
        }

        // 5. LOGIC: Page Navigation
        function changePage(direction) {
            currentPage += direction;
            renderQuestions();
            window.scrollTo(0,0);
        }

        function updatePaginationControls() {
            const totalPages = Math.ceil(filteredQuestions.length / itemsPerPage) || 1;
            document.getElementById('pageInfo').innerText = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
        }

        // Initial Load
        renderQuestions();
    </script>
